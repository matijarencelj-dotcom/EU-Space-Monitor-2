[project]
name = "ep-space-monitor"
version = "2.2.2"
description = "ESPI EP Space Monitor - tracks European Parliament committee activity on the EU space sector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matija Rencelj", email = "matija.rencelj@espi.eu" }]
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.scripts]
ep-space-monitor = "ep_space_monitor.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ep_space_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
